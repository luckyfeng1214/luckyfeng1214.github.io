<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>普通入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            background-color: #f8f9fa;
            color: #222;
            line-height: 1.7;
        }
        /* 顶部导航栏 */
        nav {
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            padding: 1rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .blog-name {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .nav-links a {
            margin-left: 2rem;
            text-decoration: none;
            color: #444;
        }
        .nav-links a:hover {
            color: #0066cc;
        }
        /* 主体容器 */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .intro-card {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        h2 {
            margin-bottom: 16px;
        }
        .article-item {
            margin-top:24px;
            padding:16px;
            border-left: 4px solid #0066cc;
            background:#f7f9fc;
        }
        .article-item a {
            font-size:1.1rem;
            color:#222;
            text-decoration:none;
        }
        .article-item a:hover {
            color:#0066cc;
        }
        footer {
            text-align:center;
            margin-top:60px;
            padding:20px;
            color:#777;
            font-size:0.9rem;
        }
    </style>
</head>
<body>
    <!--导航-->
    <nav>
        <div class="blog-name">普通入</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">文章</a>
            <a href="#">photos</a>
        </div>
    </nav>

    <div class="container">
        <div class="intro-card">
            <h2>👋 我是普通入</h2>
            <p>心情、大学日常、遇到的人</p>
        </div>

        <h3 style="margin-top:32px;">📝 最近文章</h3>
        <div class="article-item">
            <a href="#">数模竞赛小记</a>
            <p style="margin-top:6px;color:#555">备赛三天的趣事、感想、心情</p>
        </div>
        <div class="article-item">
            <a href="#">向左向右向前看</a>
            <p style="margin-top:6px;color:#555">属于我的什么时候到来</p>
        </div>
    </div>

    <footer>
        Powered by GitHub Pages | luckyfeng1214.github.io
    </footer>
</body>
</html>

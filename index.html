<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>普通入</title>
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    background-color: #f0f7ff;
    color: #1f2937;
    line-height: 1.7;
}

nav {
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(180, 210, 240, 0.25);
    padding: 1rem 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e0f0ff;
}
.blog-name {
    font-size: 1.3rem;
    font-weight: bold;
    color: #111111;
}
.nav-links a {
    margin-left: 2rem;
    text-decoration: none;
    color: #4a6fa5;
}

.nav-links a:hover {
    color: #2c7be5;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

.intro-card {
    background: #ffffff;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(170, 200, 230, 0.35);
    border: 1px solid #e6f3ff;
}

h2 {
    margin-bottom: 16px;
    color: #111111;
}

h3 {
    margin-top: 32px;
    margin-bottom: 16px;
    color: #3b82f6;
}

.article-item {
    margin-top: 16px;
    padding: 18px;
    border-left: 4px solid #7ab6ff;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(170, 200, 230, 0.25);
    border: 1px solid #e6f3ff;
}

.article-item a {
    font-size: 1.1rem;
    color: #2c5282;
    text-decoration: none;
    font-weight: 600;
}

.article-item a:hover {
    color: #2c7be5;
}

.article-item p {
    margin-top: 6px;
    color: #64748b;
}

footer {
    text-align: center;
    margin-top: 60px;
    padding: 20px;
    color: #7a8da8;
    font-size: 0.9rem;
}
.article-item{
  transition: all 0.25s ease;
}
.article-item:hover{
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(180,210,240,0.25);
}
.nav-links a{
  transition: color 0.2s;
}
.nav-links a:hover{
  color:#3478d8;
}
body{
  animation: fadeIn 0.6s;
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
.article-item a:hover{
  text-decoration: underline;
}
.hero{
    min-height: 80vh; /* 占屏幕高度80% */
    display: grid;
    place-items: center; /* 文字水平+垂直居中 */
    background: #fdfdff;
    background-image: radial-gradient(#eef0f8 0.5px, transparent 0.5px);
    background-size: 20px 20px; /*淡淡的网点背景，和截图一致 */
}
.hero-content{
    text-align:center;
}
.hero h1{
    font-size: 5rem;
    color:#222233;
    font-weight:500;
    margin:0;
}
.hero p{
    font-size:1.2rem;
    color:#555;
    margin:12px 0 30px;
}
.social-links a{
    margin:0 8px;
    color:#444;
    text-decoration:none;
}
.hero{
    min-height: 80vh;
    display: grid;
    place-items: center;
    background: #fdfdff;
    background-image: radial-gradient(#eef0f8 0.5px, transparent 0.5px);
    background-size: 20px 20px;
}
.hero-content{
    text-align:center;
}
.hero h1{
    font-size: 5rem;
    color:#222233;
    font-weight:500;
    margin:0;
}
.hero p{
    font-size:1.2rem;
    color:#555;
    margin:12px 0 30px;
}
.social-links a{
    margin:0 8px;
    color:#444;
    text-decoration:none;
}
    </style>

</head>
<body>
    <!--导航-->
    <nav>
        <div class="blog-name">普通入</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">文章</a>
            <a href="#">photos</a>
        </div>
    </nav>

    <div class="container">
        <div class="intro-card">
            <h2>👋 我是普通入</h2>
            <p>心情、大学日常、遇到的人</p>
        </div>

        <h3 style="margin-top:32px;">📝 最近文章</h3>
        <div class="article-item">
            <a href="#">数模竞赛小记</a>
            <p style="margin-top:6px;color:#555">备赛三天的趣事、感想、心情</p>
        </div>
        <div class="article-item">
            <a href="#">向左向右向前看</a>
            <p style="margin-top:6px;color:#555">属于我的什么时候到来</p>
        </div>
    </div>

    <footer>
        Powered by GitHub Pages | luckyfeng1214.github.io
    </footer>
</body>
</html>
